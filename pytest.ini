[pytest]
# Added 2026-09-02. Without this, a bare `pytest` from the repo root
# INTERNALERRORs during collection (exit 3, no tests run): scripts/
# test_vlm_merge.py is a MANUAL script that merely matches python_files, and
# it calls sys.exit(1) at import when OPENAI_API_KEY is unset.
#
# It also fixes a quieter fault. The canonical command was `pytest tests/`,
# which never collected api/tests/test_paywall_schema.py -- 39 passing tests
# that no run exercised. A suite that skips a directory is not smaller than it
# looks; it is a directory nobody is told about.
testpaths = tests api/tests
addopts = -q -m "not stress and not benchmark and not slow_visual"
python_files = test_*.py
markers =
    mvp: tests that must pass for MVP
    stress: heavy load / scaling tests (deselect by default)
    benchmark: performance regression baselines
    slow_visual: tests that run full CV pipeline with visual output (slow, may hang)
