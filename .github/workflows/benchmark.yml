name: Benchmark CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "engine/**"
      - "api/routes/lab*.py"
      - "api/routes/shoot_match.py"
      - "data/benchmarks/**"
      - "db/benchmark*.py"
      - "auth/**"
  push:
    branches:
      - main
    paths:
      - "engine/**"
      - "api/routes/lab*.py"
      - "api/routes/shoot_match.py"
      - "data/benchmarks/**"
      - "db/benchmark*.py"
      - "auth/**"

jobs:
  benchmark:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI_BENCHMARK_SECRET: ${{ secrets.CI_BENCHMARK_SECRET }}
      # The deployed URL is not a secret and the app IS deployed — the old
      # localhost fallback was written before that was true and became a
      # permanent skip condition nobody revisited. Override with the
      # NGW_BASE_URL secret for a staging run.
      NGW_BASE_URL: ${{ secrets.NGW_BASE_URL || 'https://app.noguessworksystems.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run benchmark via CI endpoint
        id: benchmark
        run: |
          # A GREEN CHECK MUST NOT MEAN "nothing ran". Until 2026-08-30 this
          # step printed a warning into the log and exited 0, so Benchmark CI
          # was green on 46 consecutive runs having executed zero benchmarks —
          # every one of them 29–54 seconds of checkout and pip install. The
          # skip was a deliberate decision pending a deployed URL; the URL
          # exists now and nobody revisited it.
          #
          # The skip is still allowed, because blocking every PR on a missing
          # secret helps nobody. What changed is that it is now IMPOSSIBLE to
          # mistake for a run: an annotation on the run page, a step summary,
          # and a hard failure on main so the signal is loud where it counts.
          if [[ -z "${CI_BENCHMARK_SECRET}" ]]; then
            {
              echo "## ⚠️ NO BENCHMARK RAN"
              echo
              echo "\`CI_BENCHMARK_SECRET\` is not set, so nothing was measured."
              echo "**A green check on this job does not mean the engine passed.**"
              echo
              echo "Fix: add the repository secret \`CI_BENCHMARK_SECRET\`."
              echo "Target: \`${NGW_BASE_URL}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=No benchmark ran::CI_BENCHMARK_SECRET is not set — nothing was measured."
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "::error title=Benchmark gate unconfigured::Failing on main so an unconfigured gate is visible rather than silently green."
              exit 1
            fi
            exit 0
          fi
          bash scripts/ci_benchmark.sh
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PR_NUMBER:  ${{ github.event.pull_request.number }}
          CI_BRANCH:     ${{ github.head_ref || github.ref_name }}
          CI_REPO:       ${{ github.repository }}

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        run: python3 scripts/post_pr_comment.py
        env:
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          CI_PR_NUMBER:  ${{ github.event.pull_request.number }}
          CI_REPO:       ${{ github.repository }}
          BENCHMARK_RESULT_FILE: /tmp/benchmark_result.json

      - name: Promote baseline on merge to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.benchmark.outcome == 'success'
        run: |
          # Mirror the same guards as the benchmark step — when the benchmark
          # was skipped (no secret or localhost fallback), it still exits 0,
          # so this step would otherwise try to curl http://localhost:8000
          # from the GH runner and fail with exit 7 (connection refused).
          if [[ -z "${CI_BENCHMARK_SECRET}" ]]; then
            echo "::warning title=Baseline not promoted::CI_BENCHMARK_SECRET is not set."
            exit 0
          fi
          curl -sS --fail -X POST "${NGW_BASE_URL}/api/lab/benchmarks/update-baseline" \
            -H "X-CI-Secret: ${CI_BENCHMARK_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"notes\": \"Auto-promoted after merge to main — ${CI_COMMIT_SHA}\"}"
        env:
          CI_COMMIT_SHA: ${{ github.sha }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: /tmp/benchmark_result.json
          retention-days: 30
