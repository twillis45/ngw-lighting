services:
  - type: web
    name: ngw-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard          # standard = 2 GB RAM — needed for mediapipe + opencv
    # The health router is mounted with prefix="/api" at main.py:319, so the
    # real route is /api/health. This said /health until 2026-08-24: Render
    # polls the declared path, would have got a 404, marked the service
    # permanently unhealthy and never routed traffic — a deploy that does not
    # error, it just never serves.
    healthCheckPath: /api/health
    envVars:
      - key: NGW_JWT_SECRET
        generateValue: true   # Render auto-generates a secure secret
      - key: ALLOWED_ORIGINS
        sync: false           # Set in Render dashboard: https://your-app.onrender.com
      - key: OPENAI_API_KEY
        sync: false           # Optional — only needed for VLM features
      - key: PORT
        value: 8000
    disk:
      name: ngw-data
      mountPath: /app/data   # SQLite DB persists here across deploys
      sizeGB: 1
