services:
  - type: web
    name: ngw-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard          # standard = 2 GB RAM — needed for mediapipe + opencv
    healthCheckPath: /health
    envVars:
      - key: NGW_JWT_SECRET
        generateValue: true   # Render auto-generates a secure secret
      # Not a secret, so it carries a value rather than sync:false — it was
      # declared sync:false, never set, and production therefore ran on the
      # localhost-only default with CORS preflight failing from its own domain.
      # Both hosts below serve this service; the apex is the marketing site.
      - key: ALLOWED_ORIGINS
        value: "https://lighting.noguessworksystems.com,https://app.noguessworksystems.com"
      - key: OPENAI_API_KEY
        sync: false           # Optional — only needed for VLM features
      - key: PORT
        value: 8000

      # ── Stripe ────────────────────────────────────────────────────────
      # Declared here so a deploy states what it needs. All are sync:false —
      # set the values in the Render dashboard, never in git.
      #
      # The account is LIVE under No Guesswork Systems LLC (2026-08-27).
      # Without STRIPE_SECRET_KEY the checkout route returns 503 with
      # "Stripe is not configured", so a missing value fails loudly rather
      # than silently taking no payments.
      # Google Sign-In. The web OAuth client ID is public (it ships in page
      # source) but is kept out of git so staging and prod can differ and so
      # the login screen's provider button stays absent until it is set.
      # Create at console.cloud.google.com -> APIs & Services -> Credentials
      # -> OAuth client ID -> Web application. Authorized JavaScript origin
      # must be the app origin exactly, scheme included.
      # Rate-limit client-IP derivation. MEASURED 2026-08-30 against production,
      # not assumed: Render appends an internal hop that VARIES per request, so
      # the client is the LEFTMOST X-Forwarded-For entry (index 0). Reading from
      # the right gave every request its own bucket and disabled rate limiting
      # entirely. See tests/test_rate_limit_key.py.
      # Shared secret for the GitHub Actions benchmark runner. The SAME value
      # must exist in TWO places or the gate silently does nothing:
      #   1. here, as a Render env var (this declaration, set in the dashboard)
      #   2. as a GitHub repo secret of the same name
      # The runner sends it as the X-CI-Secret header and auth/ci_guard.py
      # compares it to this variable. Missing here, the API answers 503
      # 'CI secret not configured on server'. Missing in GitHub, the workflow
      # skips and now fails loudly on main rather than reporting green.
      # Points every WRITABLE path at the mounted disk. Without it DATA_DIR falls
      # back to <repo>/data = /app/data, which is image storage and is destroyed
      # on every deploy. Must match the disk mountPath below.
      - key: NGW_DATA_DIR
        value: "/data"
      - key: CI_BENCHMARK_SECRET
        sync: false
      - key: TRUST_PROXY_INDEX
        value: "0"

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false           # sk_live_...
      - key: STRIPE_WEBHOOK_SECRET
        sync: false           # whsec_... from the endpoint below
      # Endpoint: https://app.noguessworksystems.com/api/stripe/webhook
      # Subscribe to exactly two events — the only two the handler reads:
      #   checkout.session.completed      -> records the subscription
      #   customer.subscription.deleted   -> cancels it
      - key: STRIPE_PRICE_ID_MONTHLY
        sync: false           # Pro monthly
      - key: STRIPE_PRICE_ID_YEARLY
        sync: false           # Pro yearly
      - key: STRIPE_PRICE_ID_STUDIO_MONTHLY
        sync: false           # Studio monthly
      - key: STRIPE_PRICE_ID_STUDIO_YEARLY
        sync: false           # Studio yearly
    disk:
      name: ngw-data
      # CORRECTED 2026-08-31. This said /app/data, which the live service does
      # NOT use — its disk is mounted at /data. Worse, /app/data is where the
      # app was actually writing, and that is image storage: WORKDIR is /app,
      # so the repo's data/ directory sits there and is rebuilt on every
      # deploy. Every write — the SQLite DB, waitlist signups, lab uploads —
      # was destroyed by the next deploy, which is why production had zero
      # benchmark cases and zero baselines no matter what.
      #
      # Proven rather than assumed: a thumbnail committed on 2026-08-30 was
      # served by production immediately, which a mounted disk at /app/data
      # would have shadowed. The disk usage graph read ~0 GB — nothing had
      # ever been written to it.
      #
      # Mounting at /app/data would ALSO hide data/reference_dataset and break
      # the gallery. So the disk stays at /data and NGW_DATA_DIR points the
      # writable paths at it, which is exactly what that variable exists for.
      mountPath: /data
      sizeGB: 1
